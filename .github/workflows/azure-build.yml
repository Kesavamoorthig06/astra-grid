name: azure-build
on:
  push:
    branches: [azure-deploy]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deploy patches
        run: |
          python3 - <<'PYEOF'
          import re, pathlib
          r = pathlib.Path('.')
          def sub(path, old, new, count=1):
              p = r / path
              s = p.read_text()
              assert old in s, (path, old)
              p.write_text(s.replace(old, new, count))

          # frontend: same-origin API in production, localhost:5000 only for local dev
          sub('frontend/config/backends.js', "return `http://${hostname}:${port}`;", "return '';")
          sub('frontend/utils/api.js', "return `http://${hostname}:${port}/api`;", "return '/api';")
          sub('frontend/config/api.js', "API_BASE_URL: `http://${hostname}:5000`,", "API_BASE_URL: '',")
          sub('frontend/components/DocumentExtractor.jsx',
              "`${window.location.protocol}//${window.location.hostname}:5000/api/document/upload`",
              "'/api/document/upload'")
          # signup: the unified backend has no email-code endpoints, so sign up directly
          sub('frontend/pages/Signup.jsx', "const checkResponse = await fetch(authUrl('/auth/check-email'), {", "await handleSignup();\n      setLoading(false);\n      return;\n      const checkResponse = await fetch(authUrl('/auth/check-email'), {")
          # login page: visible link to signup
          sub('frontend/pages/Login.jsx', "          </form>\n        </div>\n\n        <div className=\"bg-gray-50/80", "          </form>\n          <p className=\"mt-4 text-center text-sm text-gray-600\">Don't have an account? <a href=\"/signup\" className=\"text-blue-600 font-semibold\">Sign up</a></p>\n        </div>\n\n        <div className=\"bg-gray-50/80")
          # backend: real entry point, no default admin seeding
          sub('backend/Dockerfile', 'CMD ["python", "unified_api.py"]', 'ENV FLASK_ENV=production\nCMD ["python", "run.py"]')
          sub('backend/app/factory.py', "AuthService.seed_admin_users()",
              "import os as _os\n        if _os.environ.get('SEED_DEFAULT_USERS') == '1':\n            AuthService.seed_admin_users()")

          # frontend image: nginx proxies /api to the backend (BACKEND_URL set at runtime)
          nginx = pathlib.Path('nginx.conf').read_text()
          nginx = nginx.replace("    # Handle React Router",
          """    location /api/ {
                  proxy_pass ${BACKEND_URL};
                  proxy_ssl_server_name on;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  client_max_body_size 25m;
                  proxy_read_timeout 120s;
              }

              # Handle React Router""")
          pathlib.Path('nginx.conf.template').write_text(nginx)
          d = pathlib.Path('Dockerfile').read_text()
          d = d.replace("COPY nginx.conf /etc/nginx/conf.d/default.conf", "COPY nginx.conf.template /etc/nginx/templates/default.conf.template")
          pathlib.Path('Dockerfile').write_text(d)
          sub('backend/requirements.txt', 'PyJWT==2.8.1', 'PyJWT==2.8.0')
          print('patched')
          PYEOF
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr A-Z a-z)
          docker build -t ghcr.io/$OWNER/astra-grid-frontend:latest .
          docker build -t ghcr.io/$OWNER/astra-grid-backend:latest ./backend
          docker push ghcr.io/$OWNER/astra-grid-frontend:latest
          docker push ghcr.io/$OWNER/astra-grid-backend:latest
