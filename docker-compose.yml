version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: astra_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: astra_grid
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - astra_network

  # Backend API Services
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: astra_backend
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/
      - MONGODB_DB=astra_grid
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-key}
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - PORT=5000
      - CORS_ORIGINS=http://localhost:3000,http://localhost
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - astra_network
    volumes:
      - ./backend:/app
      - /app/__pycache__

  # Frontend Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astra_frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:5001
      - VITE_SIMULATION_API_URL=http://localhost:5002
      - VITE_CHATBOT_API_URL=http://localhost:8000
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - astra_network

networks:
  astra_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
